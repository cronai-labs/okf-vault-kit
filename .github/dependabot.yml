# The kit has almost no dependency surface on purpose: PyYAML, and the MCP SDK for the bridge.
# What does move is the CI actions, which are the part nobody remembers to bump.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # Titles read `ci(deps): …`; a `ci` commit never triggers a release.
    commit-message: { prefix: "ci", include: "scope" }
    # init and analyze must run the same release, or CodeQL refuses to run. Without a group,
    # Dependabot bumps each path in its own PR, and neither can pass (#56, #57). That holds
    # for majors too, so this group takes every update type.
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
      # Every other action: minor and patch updates in one weekly PR. A major gets a PR of
      # its own, so a breaking change is reviewed on its own rather than inside a batch.
      actions:
        patterns: ["*"]
        exclude-patterns: ["github/codeql-action*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build", include: "scope" }   # titles read `build(deps): …`
    # The bridge targets the 2.x server API and a new major renames it, so the pin stops at
    # <3 on purpose (docs/decisions/mcp-sdk-pinned-to-v1.md); a bot must not walk it forward.
    ignore:
      - dependency-name: mcp
        versions: [">=3"]
