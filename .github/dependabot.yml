# The kit has almost no dependency surface on purpose: PyYAML, and the MCP SDK for the bridge.
# What does move is the CI actions, which are the part nobody remembers to bump.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }     # ci: never triggers a release
    # init and analyze must run the same release, or CodeQL refuses to run. Without a group,
    # Dependabot bumps each path in its own PR, and neither can pass (#56, #57).
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
    # The bridge targets the 2.x server API and a new major renames it, so the pin stops at
    # <3 on purpose (docs/decisions/mcp-sdk-pinned-to-v1.md); a bot must not walk it forward.
    ignore:
      - dependency-name: mcp
        versions: [">=3"]
