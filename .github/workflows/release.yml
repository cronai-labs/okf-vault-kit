name: release

# The release path. Releases are cut by pushing a tag that matches VERSION:
#
#   echo 0.5.0 > VERSION                 # first: `make changelog` generates *for* this version
#   make changelog                       # git-cliff writes the `## [0.5.0]` section
#   git commit -am "chore(release): 0.5.0"
#   git tag v0.5.0 && git push origin main v0.5.0
#
# `make release` refuses unless the tree is clean and HEAD carries exactly that
# tag, so the archive can never be built from a different tree than the one the
# gate ran on. This workflow re-checks the same thing rather than trusting it:
# the tag is what users download by, and a mismatch ships the wrong bytes under
# the right name.
#
# It never creates, moves or deletes tags, and never clobbers an existing asset.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # git-cliff reads the whole history

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with: { python-version: "3.11" }

      - name: The tag must match VERSION
        env:
          REF: ${{ github.ref_name }}
        run: |
          want="v$(cat VERSION)"
          if [ "$REF" != "$want" ]; then
            echo "::error::tag '$REF' does not match VERSION ('$want')."
            echo "Update VERSION and CHANGELOG.md, commit, then re-tag."
            exit 1
          fi
          echo "tag $REF matches VERSION"

      - name: The commit must be on main
        # A release is only ever a commit main already carries. Without this a
        # tag pushed from a branch would publish code that was never reviewed.
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not reachable from origin/main"
            exit 1
          fi
          echo "commit is on main"

      - name: Build the archive
        # `make release` depends on `check`, so the gate runs here. A separate Gate step
        # ran the whole suite a second time for no added signal.
        run: make release

      - name: Release notes from CHANGELOG.md
        # The changelog is the curated artefact: it is committed, reviewed in the PR that
        # bumps the version, and it is what a reader sees in the repository. Rendering the
        # notes separately from the commit range produced a body that contradicted it.
        # git-cliff still owns `--bumped-version`, which is what it is good at.
        run: |
          python3 - <<'PY' > NOTES.md
          import pathlib, re, sys
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          sections = re.split(r"^## ", text, flags=re.M)[1:]
          if not sections:
              sys.exit("CHANGELOG.md has no '## ' section to publish")
          # The section's BODY, without its heading. `make changelog` passes `--tag v$VERSION`,
          # so the heading reads `## [0.5.0] - <date>` rather than `[Unreleased]` -- but
          # `gh release create --title "$REF"` already names the release after the tag, so
          # publishing any heading here is redundant and is the only way for it to be wrong.
          body = sections[0].split("\n", 1)[1].strip() + "\n"
          sys.stdout.write(body)
          PY
          bytes=$(wc -c < NOTES.md | tr -d ' ')
          entries=$(grep -c '^[-*] ' NOTES.md || true)
          echo "notes: ${bytes}B, ${entries} entries"
          head -20 NOTES.md
          if [ "$bytes" -lt 200 ] || [ "$entries" -lt 1 ]; then
            echo "::error::release notes are ${bytes}B / ${entries} entries -- the changelog section is empty or unparsed"
            exit 1
          fi

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          v="$(cat VERSION)"
          prerelease=""
          case "$v" in *-*) prerelease="--prerelease";; esac
          gh release create "$REF" \
            --title "$REF" \
            --notes-file NOTES.md \
            $prerelease \
            "dist/okf-vault-kit-$v.zip" \
            "dist/okf-vault-kit-$v.zip.sha256"

      - name: Verify what was published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          v="$(cat VERSION)"
          mkdir -p verify && cd verify
          gh release download "$REF" --pattern '*.zip' --pattern '*.sha256'
          shasum -a 256 -c "okf-vault-kit-$v.zip.sha256"
          unzip -q "okf-vault-kit-$v.zip"
          test -f "okf-vault-kit-$v/kit.py"
          echo "published archive verified"
