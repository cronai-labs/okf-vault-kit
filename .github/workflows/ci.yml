name: ci

# `push` is restricted to main. A branch in this repository raises BOTH a push and a
# pull_request event, so an unrestricted `push` ran every job twice for every commit on
# every pull request -- measured across eleven commits, each one ran the full matrix,
# megalinter, security and release twice. Branch work is covered by pull_request; main is
# covered by push, which is what the release workflow and the required check hang off.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is NOT in the default set ([opened, synchronize, reopened]), and the
    # policy job below reads the pull request title. Without it a title corrected
    # after opening keeps its failing result forever, because nothing re-runs the
    # check -- a required check that can never go green is worse than no check. The
    # cost is a re-run when a title or body is edited; the concurrency group above
    # cancels the superseded one.
    #
    # `ready_for_review` is deliberately absent. Nothing here skips drafts, so a draft
    # is already fully tested and marking it ready would re-run the whole matrix on
    # the identical commit. That holds ONLY while drafts run CI: add a draft skip and
    # a PR opened as a draft would never run at all, so `ready_for_review` has to come
    # back with it. test_release.py asserts that pairing rather than trusting this
    # comment to be read.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant. main is exempt:
# its runs are what `ci-required` and the release path attest to, so they must all complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  offline:
    strategy:
      fail-fast: false
      # Floor and ceiling on every OS, the full range on the cheap one.
      #
      # 3.11 is the floor `requires-python` promises, and it earns its place: a 3.11-only
      # failure has hidden behind a newer interpreter here before. 3.14 is what a user
      # actually gets -- `uv`, Homebrew and python.org all install it by default -- and it
      # was untested until now, as were 3.13 and the maintainer's own machine.
      #
      # 3.10 is out of support this October and below the floor; 3.15 is a release
      # candidate. Neither belongs here.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with: { python-version: "${{ matrix.python }}" }
      - run: make check PY=${{ matrix.python }}

  qmd-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with: { python-version: "3.12" }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      # Fetching qmd depends on a registry we do not control, so only that step is advisory.
      # Once qmd is installed, a failing end-to-end test is a real failure and fails the job.
      - id: qmd
        continue-on-error: true
        run: |
          bun install -g @tobilu/qmd
          qmd doctor
      - if: steps.qmd.outcome == 'success'
        run: make test-qmd PY=3.12
      - if: steps.qmd.outcome != 'success'
        run: echo "qmd could not be installed; the end-to-end lane did not run"

  # Conventional Commits are enforced on the PR title, because that is what a squash merge
  # writes as the subject — and the subject is what decides whether users get a release at all.
  # GitHub appends " (#123)" to it, so the pattern has to tolerate that suffix.
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: the pull request title is a conventional commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "ok: $TITLE"
          else
            echo "PR title is not a conventional commit: $TITLE"
            echo "expected e.g. 'fix(bridge): stop the policy layer failing open'"
            exit 1
          fi
      - if: github.event_name != 'pull_request'
        run: echo "not a pull request; the title policy applies at the PR"

  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }      # gitleaks scans history, not just the tip
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with: { python-version: "3.12" }
      - name: secrets, over the whole history
        run: |
          v=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --redact --no-banner --exit-code 1
      - name: python SAST
        run: uvx bandit -q -r kit.py kitlib.py kitgraph.py kitrecon.py kitproviders.py mcp -ll
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with: { languages: python }
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0

  megalinter:
    # The single lint gate. `make lint` still byte-compiles and validates the
    # template vault -- that is vault conformance, which no general linter knows
    # about -- but YAML, Markdown, shell and workflow quality live here, at one
    # pinned version rather than whichever one a contributor has installed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/python@9949bad031045f366be2467e00e8371a7328a2e2  # v10.1.0
        env:
          # ALWAYS the whole codebase, including on pull requests. MegaLinter's
          # default lints only CHANGED files, which lets a green pull request
          # turn main red on findings in files it never touched.
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both reporters need pull-requests: write, which this workflow does not
          # have. Left on, they POST on every run and log a 403 that reads like a
          # failure but is not one.
          GITHUB_COMMENT_REPORTER: false
          GITHUB_STATUS_REPORTER: false

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with: { python-version: "3.11" }
      # A synthetic tag: what is under test is that the packaging guards pass and that the
      # archive unpacks, not whether this commit deserves a release.
      - run: git tag --force "v$(cat VERSION)"
      - run: make release
      - name: the archive unpacks under the expected prefix
        run: |
          v=$(cat VERSION)
          unzip -q "dist/okf-vault-kit-$v.zip" -d unpacked
          test -f "unpacked/okf-vault-kit-$v/kit.py"
          test -f "unpacked/okf-vault-kit-$v/VERSION"
          test -f "unpacked/okf-vault-kit-$v/vault/index.md"
          test ! -d "unpacked/okf-vault-kit-$v/.github"
          cd dist && shasum -a 256 -c "okf-vault-kit-$v.zip.sha256"

  # One required check for the ruleset to point at. A matrix job cannot be required directly:
  # its check names embed the OS and Python version, so adding a row would silently stop being
  # enforced.
  #
  # The invariant: every other job in this workflow is listed in `needs`, and this job fails
  # unless all of them report success. A job missing from `needs` is a job nobody enforces — add
  # it here when you add it above. Advisory behaviour belongs on a step (`continue-on-error` on
  # that step), never on a whole job, which would hide it from this check.
  ci-required:
    needs: [offline, qmd-e2e, policy, security, megalinter, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every dependency must have succeeded
        # Passed through env rather than interpolated into the script. Inlining
        # ${{ }} in a run block splices the value into the shell before it runs,
        # which is both a quoting hazard and the classic Actions script-injection
        # shape; env binds it as data instead.
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$bad" ]; then echo "not green: $(echo "$bad" | tr '\n' ' ')"; exit 1; fi
