# MegaLinter configuration — https://megalinter.io
#
# The single lint gate, replacing a `make lint` that byte-compiled the modules
# and validated the template vault. That caught syntax errors and vault
# conformance, which is worth having, but nothing about YAML, Markdown, shell or
# workflow quality — and whatever linter a contributor happened to have installed
# would have disagreed with CI's anyway. A pinned container is one version
# everywhere.
#
# Deliberately a whitelist. Two exceptions worth knowing:
#
#   * Python is NOT linted here yet. ruff reports 135 findings on its defaults
#     and 281 on E,F against this tree; making that blocking needs a cleanup pass
#     and a decision about the rule set, which is issue #4. Enabling it here
#     before that work would either block every PR or force a blanket ignore,
#     and a gate nobody can pass is a gate people route around.
#   * Secret scanning stays a separate gitleaks step in ci.yml. The scanners
#     bundled in the flavors detect less, and gitleaks needs full history, which
#     is a checkout option rather than a linter setting.

APPLY_FIXES: none

# MegaLinter treats formatter findings as non-blocking by DEFAULT, so a formatter
# can report errors while the job still concludes success — and this job feeds
# ci-required. Without this line the gate is decorative.
FORMATTERS_DISABLE_ERRORS: false

# A linter named here but absent from the flavor is an error rather than a silent
# skip. Otherwise picking the wrong flavor removes checks invisibly.
FAIL_IF_MISSING_LINTER_IN_FLAVOR: true

SHOW_ELAPSED_TIME: true
PRINT_ALPACA: false

ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - BASH_SHELLCHECK
  - MARKDOWN_MARKDOWNLINT
  - YAML_YAMLLINT

# `.kit/` and `dist/` are generated by the tooling; `.venv/` by uv.
FILTER_REGEX_EXCLUDE: '(^|/)(\.kit|dist|\.venv)/'

MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.yaml
# vault/ is the product, not documentation about it: notes written for Obsidian,
# whose wikilinks, callouts and Bases embeds are not CommonMark, plus index.md
# and log.md which kit.py generates. A finding there is a finding in the
# generator or in Obsidian's dialect, neither of which a contributor fixes by
# editing the file.
MARKDOWN_FILTER_REGEX_EXCLUDE: '^vault/'
YAML_YAMLLINT_CONFIG_FILE: .yamllint.yml
YAML_FILTER_REGEX_EXCLUDE: '^vault/'
