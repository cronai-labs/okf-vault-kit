# git-cliff configuration
#
# Drives two things from the same conventional-commit history:
#   git cliff --bumped-version      -> the next semver, used by `make release`
#   git cliff --output CHANGELOG.md -> the changelog
#
# Only user-visible types reach the notes and the bump. A README typo must not
# cut a release, which is also why the PR-title policy in ci.yml matters: the
# squash subject is what lands here.
#
# The type -> section mapping below mirrors the bump semantics documented in
# commitlint.config.cjs. If you add a type there, add it here too.

[changelog]
header = """
# Changelog

All notable changes to OKF Vault Kit are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# One line per change: subject, scope, and a short SHA that links to the commit.
#
# `commit.message` is the SUBJECT. It must never become `commit.body`: the working
# model sets squash_merge_commit_message=PR_BODY, so every squash commit on main
# carries the whole pull request description. schriftsatz rendered bodies once and
# its v0.2.0 notes came to 14,014 bytes across 27 entries; the same range is 1,160
# bytes and 6 entries this way.
#
# The detail is not lost, it is one click away: GitHub auto-links the `(#NN)` that
# squash-merging appends to the subject, and the SHA links to the commit whose body
# carries the full reasoning.
#
# The repository URL is a literal, not `{{ remote.link }}`. Configuring
# [remote.github] makes git-cliff call the GitHub API for metadata, which needs
# network, a token and a writable cache -- it panics in a release container without
# them. A release must not depend on an API call it does not need.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/cronai-labs/okf-vault-kit/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""

footer = """
"""

trim = true

[git]
conventional_commits = true
# Commits that are not conventional (the pre-commitlint history, and merge
# commits) are dropped rather than dumped into an "Other" bucket.
filter_unconventional = true
filter_commits = true
split_commits = false
protect_breaking_commits = true

# Tags carry a leading v. The pattern also matches a prerelease suffix, which is
# kept available even though v0.1.0 does not use one.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  # The <!-- n --> prefixes only order the sections (group_by sorts
  # alphabetically); striptags removes them in the template.
  # The commit that seeded this repository. It is the baseline v0.1.0 describes, not a
  # change within it, and its subject names a version from the archived private history
  # that no longer exists anywhere public. Listing it as a Feature of 0.1.0 reads as a
  # release note for a version nobody can find. Matched on its exact subject so nothing
  # else is caught.
  { message = "^feat: OKF Vault Kit v0\\.4\\.0-alpha", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverts" },
  # Everything below is real work but not release-note material.
  { message = "^docs", skip = true },
  { message = "^style", skip = true },
  { message = "^refactor", skip = true },
  { message = "^test", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
]

[bump]
# The public history starts here. The private history that preceded it is archived,
# not replayed, so this repository's first tag is its first release.
# See docs/decisions/public-history-starts-at-0-1-0.md.
initial_tag = "v0.1.0"

# Pre-1.0: a feat takes 0.4.x -> 0.5.0, and a breaking change does the same
# rather than jumping to 1.0.0. The kit is an alpha; 1.0 should be a decision,
# not an accident of a `!` in a commit subject.
features_always_bump_minor = true
breaking_always_bump_major = false
